name: risk-pwa-daily
on:
  schedule:
    # GitHub 用 UTC。新加坡時間(SGT) = UTC+8
    - cron: "15 23 * * *"   # 07:15 SGT 完整更新（job=full）
    - cron: "35 6 * * *"    # 14:35 SGT 台股收盤後（job=tw_close）
    - cron: "10 21 * * *"   # 05:10 SGT 美股廣度（job=us_breadth）
  workflow_dispatch:
    inputs:
      job:
        description: "要跑哪個工作"
        default: "full"
        type: choice
        options: [full, tw_close, us_breadth, tw_probe, us_probe]
      dry_run:
        description: "只測試、不寫資料庫"
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 決定工作
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "15 23 * * *") echo "job=full" >> $GITHUB_OUTPUT ;;
            "35 6 * * *")  echo "job=tw_close" >> $GITHUB_OUTPUT ;;
            "10 21 * * *") echo "job=us_breadth" >> $GITHUB_OUTPUT ;;
            *) echo "job=${{ github.event.inputs.job || 'full' }}" >> $GITHUB_OUTPUT ;;
          esac
      - name: 抓資料（金鑰一律用 Secrets）
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 pipeline/fetch.py --job ${{ steps.pick.outputs.job }} --dry-run
          else
            python3 pipeline/fetch.py --job ${{ steps.pick.outputs.job }}
          fi
      - name: 上傳本次紀錄（失敗也留檔）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: data/
