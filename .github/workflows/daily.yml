name: risk-pwa-daily
on:
  schedule:
    # GitHub 用 UTC。新加坡時間(SGT) = UTC+8
    - cron: "15 23 * * *"   # 07:15 SGT 完整更新（job=full）
    - cron: "35 6 * * *"    # 14:35 SGT 台股收盤後（job=tw_close）
    - cron: "0 13 * * *"    # 21:00 台灣時間 台股收盤後第二次 tw_close：融資融券、借券、期交所法人與散戶多空比等晚上才會齊，14:35 那次常拿到前一天
    - cron: "30 22 * * *"   # 06:30 SGT 美股廣度（job=us_breadth）：美股收盤後 90 分鐘以上（冬令 05:00 SGT 收盤、夏令 04:00 SGT），Nasdaq 的日資料才確定；太早跑會只拿到前一天
    - cron: "0 21 * * 0"    # 每週日 05:00 SGT 長回補（job=tw_backfill2）：歷史已經補完，改成每週一次，省 GitHub Actions 分鐘數（私人倉庫每月只有 2000 分鐘；備援與每晚回補已在 11/24 刪掉以省額度）
    - cron: "15 15 * * *"   # 23:15 SGT 午夜前再查一次（午夜之後每日重大訊息會換成隔天的）
    - cron: "45 12 * * 2-6" # 20:45 SGT（週二到週六）美股選擇權快照（job=us_options）：美東早上，OCC 已更新前一天的未平倉量
  workflow_dispatch:
    inputs:
      job:
        description: "要跑哪個工作"
        default: "full"
        type: choice
        options: [full, tw_close, us_breadth, tw_probe, us_probe, tw_backfill, tw_backfill2, tw_events, us_options]
      dry_run:
        description: "只測試、不寫資料庫"
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: risk-pwa-${{ github.event.schedule || github.run_id }}        # 每個排程、每次手動各自一組：排隊中的不會被別的工作擠掉（以前同一組只留一個，手動連按或長工作會讓排程被取消）
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安裝讀 .xls 的套件（AAII 完整歷史用；失敗不影響其他工作）
        run: pip install xlrd || true
      - name: 決定工作
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "15 23 * * *") echo "job=full" >> $GITHUB_OUTPUT ;;
            "35 6 * * *")  echo "job=tw_close" >> $GITHUB_OUTPUT ;;
            "0 13 * * *")  echo "job=tw_close" >> $GITHUB_OUTPUT ;;
            "30 22 * * *") echo "job=us_breadth" >> $GITHUB_OUTPUT ;;
            "0 21 * * 0")  echo "job=tw_backfill2" >> $GITHUB_OUTPUT ;;
            "15 15 * * *") echo "job=tw_events" >> $GITHUB_OUTPUT ;;
            "45 12 * * 2-6") echo "job=us_options" >> $GITHUB_OUTPUT ;;
            *) echo "job=${{ github.event.inputs.job || 'full' }}" >> $GITHUB_OUTPUT ;;
          esac
      - name: 抓資料（金鑰一律用 Secrets）
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 pipeline/fetch.py --job ${{ steps.pick.outputs.job }} --dry-run
          else
            python3 pipeline/fetch.py --job ${{ steps.pick.outputs.job }}
          fi
      - name: 上傳本次紀錄（失敗也留檔）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: run-log-${{ github.run_id }}
          path: data/
